name: macOS

# macOS is checked in its own workflow, apart from CI. GitHub's free macOS runners are often not assigned at all (the job then
# sits queued and is cancelled with "not acquired by Runner of type hosted", having run no step), and a shortage is not a
# test failure. Keeping it separate means CI is red only for what actually ran and failed, while this workflow's own badge
# and run list say honestly whether macOS ran. Re-run a cancelled run by hand, later; never in a loop.
# One job on an ordinary push; on a v* tag, or by hand with full = true, Node 24 is checked as well.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      full:
        description: Also run the checks on Node 24
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: The stand-in client verifies the test server
        if: ${{ !cancelled() }}
        run: node dist/main.js run --client standin --out proof -- node test/fixtures/echo-server.mjs && node dist/main.js validate proof/compat.json
      - name: Pack the tarball
        id: pack
        if: ${{ !cancelled() }}
        run: |
          name=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)
          echo "tgz=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
      - name: Run the Action from the tarball
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: ./
        with:
          server: node test/fixtures/echo-server.mjs
          clients: standin
          out: action-out
          package: ${{ steps.pack.outputs.tgz }}
      - name: The Action wrote a valid record
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: node dist/main.js validate action-out/compat.json
      - name: Install the real client
        if: ${{ !cancelled() }}
        run: npm install --global @anthropic-ai/claude-code@2.1.317
      - name: Claude Code starts the test server
        if: ${{ !cancelled() }}
        run: node dist/main.js run --client claude-code --out real-proof -- node test/fixtures/echo-server.mjs && node dist/main.js validate real-proof/compat.json

  macos-node24:
    if: ${{ inputs.full || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
